<!DOCTYPE html>
<html lang ="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Second Graded Exercise 3Q</title>
</head>

<body>
    <h1 class="linear-text-gradient">Second Graded Exercise 3Q</h1>
    <p class="box"><a href="viewSignUps.html"> View Signups </a></p>
    <form method="post">
        <label for="StudentID">StudentID:</label><br/>
        <input placeholder="Enter Student ID" type="number" id="StudentID" name="StudentID" onblur="checkEmpty(this)"> <br>

        <label for="fullName">Full Name:</label><br/>
        <input placeholder="Enter Full Name" type="text" id="fullName" name="fullName" onblur="checkEmpty(this)"> <br>

        <label for="birthDay">Birthday:</label><br/>
        <input placeholder="Enter Birthday" type="date" id="birthDate" name="birthDate" onblur="checkEmpty(this)"> <br>

        <label for="emailAdd">Email adress:</label><br/>
        <input placeholder="Enter Email Address" type="email" id="emailAdd" name="emailAdd" onblur="checkEmpty(this)"> <br>

        <label for="mobileCell">Mobile Phone:</label><br/>
        <input placeholder="Enter Mobile Phone Number" type="text" id="mobileCell" name="mobileCell" onblur="checkEmpty(this)"> <br>

        <label for="gradeLvl">Grade Level:</label><br/>
        <select id="gradeLvl">
            <option value="G7">G7</option>
            <option value="G8">G8</option>
            <option value="G9">G9</option>
            <option value="G10">G10</option>
            <option value="G11">G11</option>
            <option value="G12">G12</option>
        </select> <br>

        <p>Choose whether you are:</p>
        <label>
            <input type="radio" name="type" value="ext">
            Extern
        </label><br>

        <label>
            <input type="radio" name="type" value="int">
            Intern
        </label><br>

        <label for="prefOrg">Preferred Organization/Club:</label><br/>
        <select id="prefOrg">
            <option value="Ellipsis">Ellipsis</option>
            <option value="Flux">Flux</option>
            <option value="Himig Agham">Himig Agham</option>
            <option value="Bravura">Bravura</option>
            <option value="Tomorrow">Tomorrow</option>
            <option value="Pallastro">Pallastro</option>
            <option value="Volant">Volant</option>
        </select> <br>

        <label for="textArea">Why do you want to join:</label><br/>
        <textarea placeholder="Enter your reason here" id="textArea" name="textArea" onblur="checkEmpty(this)"></textarea> <br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        
    </form>
    <script>
        function checkEmpty(el) {
            if (!el.value.trim()) {
                el.classList.add('error');
            } else {
                el.classList.remove('error');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const form = document.querySelector('form');
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                if (!confirm('Are you sure?')) return;

                const data = {
                    studentID: document.getElementById('StudentID').value.trim(),
                    fullName: document.getElementById('fullName').value.trim(),
                    emailAdd: document.getElementById('emailAdd').value.trim(),
                    mobileCell: document.getElementById('mobileCell').value.trim(),
                    gradeLvl: document.getElementById('gradeLvl').value,
                    type: (document.querySelector('input[name="type"]:checked') || {}).value || '',
                    prefOrg: document.getElementById('prefOrg').value,
                };

                const key = 'submissions';
                const existing = JSON.parse(localStorage.getItem(key) || '[]');
                existing.push(data);
                localStorage.setItem(key, JSON.stringify(existing));

                alert('Submission saved locally.');
            });
        });
    </script>
</body>
